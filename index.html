<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
        (function(){try{var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
    </script>
    <title>Bird Flap</title>
    <style>
        .site-header {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 10;
        }
        .theme-toggle {
            color: var(--fg);
            background: transparent;
            border: 1px solid currentColor;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            display: inline-flex;
        }
        .caption a {
            color: var(--fg);            /* match the caption text */
            text-decoration: underline;  /* keep it readable as a link */
        }
        :root                      { --bg: #000;     --fg: #fff; }  /* default = dark  */
        :root[data-theme="dark"]   { --bg: #000;     --fg: #fff; }  /* black */
        :root[data-theme="light"]  { --bg: #fff;     --fg: #111; }  /* white */
        :root[data-theme="dim"]    { --bg: #808080;  --fg: #111; }  /* grey  */
        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--fg);
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }
        canvas {
            display: block;
        }
    </style>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="copy-dir" href="assets" />
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  </head>
  <body>
    <script>
    (function () {
      const OrigAudioContext = window.AudioContext || window.webkitAudioContext;
      if (!OrigAudioContext) return;
    
      const contexts = [];
      const Patched = new Proxy(OrigAudioContext, {
        construct(target, args) {
          const ctx = new target(...args);
          contexts.push(ctx);
          return ctx;
        }
      });
      window.AudioContext = Patched;
      if (window.webkitAudioContext) window.webkitAudioContext = Patched;
    
      const events = ["click", "touchstart", "touchend", "pointerup", "mousedown", "keydown"];
      function resumeAll() {
        let allRunning = contexts.length > 0;
        for (const ctx of contexts) {
          if (ctx.state !== "running") {
            ctx.resume();
            if (ctx.state !== "running") allRunning = false;
          }
        }
        if (allRunning) {
          for (const e of events) window.removeEventListener(e, resumeAll);
        }
      }
      for (const e of events) window.addEventListener(e, resumeAll);
    })();
    </script>
    <header class="site-header">
      <nav class="nav">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </header>

    <canvas id="bevy"></canvas>
    <p class="caption">Made with <a href="https://bevy.org/">Bevy Engine</a> following the example of <a href="https://www.rustadventure.dev/flappy-bird">chris biscardi</a> while adding my own twist.</p>
    <script>
      (function(){
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        var MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
        var SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
        var DIM = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>';
        var THEMES = ['light', 'dim', 'dark'];
        var ICONS = { light: SUN, dim: DIM, dark: MOON };
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function current(){ var t = document.documentElement.getAttribute('data-theme'); return t || (mq.matches ? 'dark' : 'light'); }
        function sync(){
          var c = current();
          btn.innerHTML = ICONS[c] || SUN;
          btn.setAttribute('aria-label', 'Theme: ' + c + '. Click to change.');
        }
        sync();
        btn.addEventListener('click', function(){
          var next = THEMES[(THEMES.indexOf(current()) + 1) % THEMES.length];
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch(e){}
          sync();
        });
        // Follow the system theme live while the visitor hasn't chosen one.
        mq.addEventListener('change', function(){
          if (!document.documentElement.getAttribute('data-theme')) sync();
        });
      })();
    </script>
    </body>
</html>
